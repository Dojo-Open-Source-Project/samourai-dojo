services:
  mempool_api:
    container_name: "mempool_api"
    image: mempool/backend:v${MEMPOOL_API_VERSION_TAG}
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15s
    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - data-mempool_api:/backend/cache
      - ./mysql/mempool-mariadb-compat.cjs:/mempool-mariadb-compat.cjs:ro
    env_file:
      - ./.env
      - ./conf/docker-explorer.conf
      - ./conf/docker-bitcoind.conf
      - ./conf/docker-indexer.conf
    environment:
      NODE_OPTIONS: "--require=/mempool-mariadb-compat.cjs"
      MEMPOOL_BACKEND: "electrum"
      CORE_RPC_HOST: ${BITCOIND_IP}
      CORE_RPC_PORT: ${BITCOIND_RPC_PORT}
      CORE_RPC_USERNAME: ${BITCOIND_RPC_USER}
      CORE_RPC_PASSWORD: ${BITCOIND_RPC_PASSWORD}
      ELECTRUM_HOST: ${INDEXER_IP}
      ELECTRUM_PORT: ${INDEXER_RPC_PORT}
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: ${MEMPOOL_MYSQL_DATABASE}
      DATABASE_USERNAME: ${MEMPOOL_MYSQL_USER}
      DATABASE_PASSWORD: ${MEMPOOL_MYSQL_PASS}
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_CACHE_DIR: "/backend/cache"
      MEMPOOL_CLEAR_PROTECTION_MINUTES: "20"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      db:
        condition: service_started
      mempool_db_init:
        condition: service_completed_successfully
    networks:
      dojonet:
        ipv4_address: ${NET_MEMPOOL_API_IPV4}

  mempool_web:
    container_name: "mempool_web"
    image: mempool/frontend:v${MEMPOOL_WEB_VERSION_TAG}
    user: "1000:1000"
    restart: always
    stop_grace_period: 15s
    command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    env_file:
      - ./.env
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: ${NET_MEMPOOL_API_IPV4}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      db:
        condition: service_started
      mempool_db_init:
        condition: service_completed_successfully
    networks:
      dojonet:
        ipv4_address: ${NET_MEMPOOL_WEB_IPV4}

  # Runs on every Compose start, including when the Dojo data volume already exists.
  mempool_db_init:
    image: "samouraiwallet/dojo-db:${DOJO_DB_VERSION_TAG}"
    pull_policy: never
    restart: "no"
    entrypoint: ["bash", "/provision-mempool-db.sh"]
    volumes:
      - ./mysql/provision-mempool-db.sh:/provision-mempool-db.sh:ro
    env_file:
      - ./.env
      - ./conf/docker-mysql.conf
      - ./conf/docker-explorer.conf
    depends_on:
      - db
    networks:
      - dojonet

volumes:
  data-mempool_api:
